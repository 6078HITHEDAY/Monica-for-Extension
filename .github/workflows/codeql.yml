name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      # The build refuses to ship without the verified browser engine; build the
      # pinned package exactly as the CI validate job does.
      - name: Build the pinned browser MDBX engine
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target wasm32-unknown-emscripten
          git clone --no-checkout https://github.com/emscripten-core/emsdk.git .tmp/emsdk
          git -C .tmp/emsdk checkout --detach eb5eb4b3b2b792f44ded198bfe615c985da5be2c
          python .tmp/emsdk/emsdk.py install 4.0.18
          python .tmp/emsdk/emsdk.py activate 4.0.18
          source .tmp/emsdk/emsdk_env.sh
          cargo +1.97.0 fetch --locked --manifest-path native/mdbx2-browser/Cargo.toml --target wasm32-unknown-emscripten
          npm run build:mdbx2-browser
      - run: npm run build
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          output: codeql-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Preserve private-repository CodeQL SARIF
        if: github.event.repository.private
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
