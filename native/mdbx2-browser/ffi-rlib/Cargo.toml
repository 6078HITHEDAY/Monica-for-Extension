# Same pinned sources/dependencies as the Android FFI crate, without building
# Android's staticlib and cdylib artifacts for the browser.
[package]
name = "mdbx-ffi"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "mdbx_ffi"
path = "../../mdbx2-host/vendor/mdbx/crates/mdbx-ffi/src/lib.rs"
crate-type = ["rlib"]

[dependencies]
mdbx-core = { path = "../../mdbx2-host/vendor/mdbx/crates/mdbx-core" }
mdbx-storage = { path = "../../mdbx2-host/vendor/mdbx/crates/mdbx-storage", default-features = false, features = ["core", "filesystem-blob-store"] }
mdbx-sync = { path = "../../mdbx2-host/vendor/mdbx/crates/mdbx-sync", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uniffi = "=0.31.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8"
